name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skill-tests:
    name: Skill tests — Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 23]
        include:
          - node-version: 20
            runner: tsx
          - node-version: 22
            runner: native
          - node-version: 23
            runner: native
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: All 4 skills (63 tests) — native strip-types
        if: matrix.runner == 'native'
        run: |
          node --experimental-strip-types --test \
            skills/pairwise-test-coverage/pairwise.spec.ts \
            skills/barrier-concurrency-testing/test-fixtures.spec.ts \
            skills/breaking-change-detector/breaking-change.spec.ts \
            skills/websocket-client-resilience/resilience.spec.ts

      - name: All 4 skills (63 tests) — npx tsx
        if: matrix.runner == 'tsx'
        run: |
          npx tsx --test \
            skills/pairwise-test-coverage/pairwise.spec.ts \
            skills/barrier-concurrency-testing/test-fixtures.spec.ts \
            skills/breaking-change-detector/breaking-change.spec.ts \
            skills/websocket-client-resilience/resilience.spec.ts
