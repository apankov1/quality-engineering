name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  skill-tests:
    name: Skill tests — Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 23]
        include:
          - node-version: 20
            runner: tsx
          - node-version: 22
            runner: native
          - node-version: 23
            runner: native
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: All skills — native strip-types
        if: matrix.runner == 'native'
        run: node --experimental-strip-types --test skills/*/*.spec.ts

      - name: All skills — npx tsx
        if: matrix.runner == 'tsx'
        run: npx tsx --test skills/*/*.spec.ts
